[project]
name = "seco-api"
version = "0.1.0"
description = "SECO Smart EV Charging FastAPI backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]",
    "pymongo",
    "pydantic-settings",
    "pyjwt",
    "pwdlib[argon2]",
    "aiomqtt",
    "qrcode[pil]"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]