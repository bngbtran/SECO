function dsave() {
  const k = DLG.kind, a = DLG.arg;
  if (k === 'addStation' || k === 'editStation') {
    const name = val('f-name'), addr = val('f-addr'); if (!name) return dErr('Vui lòng nhập tên trạm.');
    if (k === 'addStation') {
      const id = 'ST-' + String(S.stations.length + 1).padStart(2, '0');
      S.stations.push({ id, code: val('f-code') || id, name, addr, kind: val('f-kind'), status: 'READY', lock: 'UNLOCKED', online: true, temp: 29.5, v: 12.05, i: 0, p: 0, x: 15 + Math.random() * 70, y: 15 + Math.random() * 65, fw: '1.2.0', relay: false, session: null, installed: Date.now() });
      mqtt(id, 'status', '{"state":"ONLINE"}', 'in'); audit('STATION_CREATE', id, `${name} (${val('f-kind')})`); toast('Đã thêm trạm', `${id} · ${name}`);
    } else { const st = stById(a); Object.assign(st, { name, addr, code: val('f-code') || st.code, kind: val('f-kind') }); audit('STATION_UPDATE', a, name); toast('Đã cập nhật trạm', st.code); }
  } else if (k === 'addUser' || k === 'editUser') {
    const name = val('f-name'), email = val('f-email'); if (!name || !/.+@.+\..+/.test(email)) return dErr('Nhập họ tên và email hợp lệ.');
    if (S.users.some(u => u.email === email && u.id !== a)) return dErr('Email đã tồn tại.');
    if (k === 'addUser') { const id = 'U-' + String(7 + S.users.filter(u => u.role === 'USER').length).padStart(3, '0'); S.users.push({ id, name, email, phone: val('f-phone'), role: val('f-role'), balance: 0, active: true, created: Date.now() }); audit('USER_CREATE', id, name); toast('Đã tạo người dùng', `${id} · ${name}`, 'user-plus'); }
    else { Object.assign(userById(a), { name, email, phone: val('f-phone'), role: val('f-role') }); audit('USER_UPDATE', a, name); toast('Đã lưu thay đổi', name); }
  } else if (k === 'adjust') {
    const amt = Math.round(+val('f-amt')), note = val('f-note'); if (!(amt > 0)) return dErr('Số tiền phải lớn hơn 0.'); if (!note) return dErr('Vui lòng nhập lý do.');
    const u = userById(a); const d = val('f-dir') === '-' ? -amt : amt; if (u.balance + d < 0) return dErr('Số dư không thể âm.');
    const before = u.balance; u.balance += d;
    S.transactions.unshift({ id: 'TX-' + (4000 + S.transactions.length), type: 'ADJUSTMENT', userId: u.id, amount: d, before, after: u.balance, status: 'SUCCESS', time: Date.now(), note });
    audit('WALLET_ADJUST', u.id, `${d > 0 ? '+' : ''}${vnd(d)} · ${note}`); toast('Đã điều chỉnh số dư', `${u.name} · ${vnd(u.balance)}`, 'wallet');
  } else if (k === 'linkCard') {
    const c = S.cards.find(x => x.id === val('f-card')); c.userId = a; c.status = 'ACTIVE'; audit('CARD_ASSIGN', c.id, userName(a)); toast('Đã gán thẻ', `${c.uid} → ${userName(a)}`, 'credit-card');
  } else if (k === 'assignCard') {
    const c = S.cards.find(x => x.id === a); c.userId = val('f-user'); c.status = 'ACTIVE'; audit('CARD_ASSIGN', c.id, userName(c.userId)); toast('Đã gán thẻ', `${c.uid} → ${userName(c.userId)}`, 'credit-card');
  } else if (k === 'fault') {
    const f = S.faults.find(x => x.id === a); f.status = val('f-st'); f.assignee = val('f-tech') || null; audit('FAULT_UPDATE', f.id, f.status + (f.assignee ? ' · ' + userName(f.assignee) : '')); toast('Đã cập nhật sự cố', `${f.id} · ${f.status}`, 'wrench');
  } else if (k === 'price') {
    const p = Math.round(+val('f-price')); if (!(p >= 500 && p <= 20000)) return dErr('Giá hợp lệ từ 500 đến 20.000 VND/kWh.');
    if (p === S.price) return dErr('Giá mới trùng giá hiện tại.');
    S.prices[0].to = Date.now(); S.prices.unshift({ price: p, from: Date.now(), by: 'Bùi Ngọc Bảo Trân', note: val('f-note') || 'Cập nhật giá' });
    audit('PRICE_UPDATE', 'price_per_kwh_vnd', `${S.price.toLocaleString('vi-VN')} → ${p.toLocaleString('vi-VN')}`); S.price = p; toast('Đã cập nhật giá', `${vnd(p)}/kWh · áp dụng cho phiên mới`, 'badge-dollar-sign');
  } else if (k === 'cmd') { closeDlg(); return execCmd(a[0], a[1]); }
  closeDlg(); renderAll();
}

function execCmd(stId, c) {
  const st = stById(stId);
  mqtt(stId, 'cmd', JSON.stringify({ action: c }), 'in');
  audit('STATION_CMD', stId, c);
  if (!st.online) { renderAll(); return setTimeout(() => { toast('cmd_ack timeout', `${st.code} không phản hồi lệnh ${c} sau 5s`, 'alert-triangle'); }, 900); }
  const ack = extra => mqtt(stId, 'cmd_ack', JSON.stringify({ action: c, ok: true, ...extra }));
  if (c === 'LOCK') { st.lock = 'LOCKED'; ack({ lock: 'LOCKED' }); toast('Đã khoá đầu cắm', st.code, 'lock'); }
  if (c === 'UNLOCK') {
    const w = S.sessions.find(s => s.station === stId && s.status === 'WAITING_PAYMENT');
    st.lock = 'UNLOCKED'; ack({ lock: 'UNLOCKED' }); toast('Đã mở khoá đầu cắm', w ? `${st.code} · lưu ý ${w.id} vẫn chờ thanh toán` : st.code, 'lock-open');
  }
  if (c === 'STOP') { if (st.session) { ack({}); stopSession(stId, 'TECHNICIAN'); if (stId === 'ST-01') SIM.plugged = SIM.plugged && st.lock === 'LOCKED'; } else { ack({ note: 'no_active_session' }); toast('Không có phiên để dừng', st.code, 'info'); } }
  if (c === 'MAINTENANCE') {
    if (st.session) stopSession(stId, 'TECHNICIAN');
    st.status = 'MAINTENANCE'; st.relay = false; ack({ state: 'MAINTENANCE' });
    if (!S.maint.some(m => m.station === stId && m.status === 'IN_PROGRESS')) S.maint.unshift({ id: 'MR-' + String(108 + S.maint.length).padStart(4, '0'), station: stId, fault: (S.faults.find(f => f.station === stId && f.status !== 'RESOLVED') || {}).id, tech: 'U-201', start: Date.now(), end: null, status: 'IN_PROGRESS', action: '', parts: '' });
    toast('Trạm chuyển MAINTENANCE', `${st.code} · chờ KTV xử lý`, 'wrench');
  }
  if (c === 'RESET') { st.relay = false; ack({ rebooting: true }); setTimeout(() => { mqtt(stId, 'status', '{"state":"ONLINE","boot":true}', 'in'); toast('Trạm khởi động lại xong', `${st.code} · ONLINE · fw ${st.fw}`, 'rotate-ccw'); renderAll(); }, 1600); }
  if (c === 'PING') { const ms = 18 + Math.floor(Math.random() * 40); ack({ rtt_ms: ms }); toast('PONG', `${st.code} phản hồi sau ${ms}ms`, 'radio'); }
  renderAll();
}

/* ================= Mobile navigation ================= */
function mgo(screen, arg = null, push = true) {
  if (push && MOB.screen !== screen) MOB.back.push([MOB.screen, MOB.arg]);
  if (MOB.back.length > 30) MOB.back.shift();
  MOB.role = screen.startsWith('t-') ? 'tech' : (screen === 'login' ? MOB.role : 'member');
  if (screen === 'setup') { MOB.budget = 0; MOB.budgetCustom = ''; MOB.budgetErr = ''; }
  if (screen === 'topup' && !MOB.topup) MOB.topup = 20000;
  MOB.screen = screen; MOB.arg = arg;
  const sc = $('#mscreen .mbody'); if (sc) sc.scrollTop = 0;
}

/* ================= Dispatcher ================= */
const ACT = {
  tab: k => { APP.tab = k; window.scrollTo(0, 0); },
  go: v => { if (APP.tab !== 'admin') APP.tab = 'admin'; ADM.view = v; ADM.id = null; const c = $('.acontent'); if (c) c.scrollTop = 0; },
  open: (v, id) => { APP.tab = 'admin'; ADM.view = v; ADM.id = id; if (v === 'user') ADM.userTab = 'cards'; setTimeout(() => { const c = $('.acontent'); if (c) c.scrollTop = 0; }); },
  login: () => { S.loggedIn = true; toast('Đăng nhập thành công', 'Xin chào Bảo Trân · ADMIN', 'log-in'); },
  logout: () => { S.loggedIn = false; },
  stf: k => ADM.stFilter = k, ssf: k => ADM.ssFilter = k, sst: k => ADM.ssType = k, utab: k => ADM.userTab = k, txtab: k => ADM.txTab = k, ff: k => ADM.faultFilter = k,
  dlg: (k, a) => { dialog(k, a); return 'norender'; },
  cmd: (st, c) => { dialog('cmd', [st, c]); return 'norender'; },
  dclose: () => { closeDlg(); return 'norender'; },
  dsave: () => { dsave(); return 'norender'; },
  dreg: () => { DLG.st = val('f-st'); if (!DLG.st) return dErr('Không có trạm READY.'), 'norender'; DLG.step = 1; mqtt(DLG.st, 'cmd', '{"action":"REGISTER_MODE","timeout_s":30}', 'in'); mqtt(DLG.st, 'cmd_ack', '{"action":"REGISTER_MODE","ok":true}'); audit('CARD_REGISTER_START', DLG.st, 'Bật chế độ đăng ký thẻ mới'); if (DLG.st === 'ST-01') flash('REGISTER MODE', 'QUET THE MOI...', 8000); regDlg(); DLG.timer = setTimeout(regScan, 6000); return 'norender'; },
  dregscan: () => { regScan(); return 'norender'; },
  toggleUser: id => { const u = userById(id); u.active = !u.active; S.cards.filter(c => c.userId === id).forEach(c => c.status = u.active ? 'ACTIVE' : 'INACTIVE'); audit('USER_UPDATE', id, u.active ? 'Mở khoá tài khoản' : 'Khoá tài khoản, vô hiệu thẻ'); toast(u.active ? 'Đã mở khoá tài khoản' : 'Đã khoá tài khoản', u.name, u.active ? 'check-circle' : 'lock'); },
  unlink: id => { const c = S.cards.find(x => x.id === id); audit('CARD_UNLINK', id, userName(c.userId)); c.userId = null; c.status = 'PENDING'; toast('Đã gỡ liên kết thẻ', `${c.uid} chuyển về PENDING`, 'unlink'); },
  speed: v => { S.speed = +v; },
  gsearch: () => 'norender',
  flowgo: g => {
    if (g === 'sim') return void (APP.tab = 'sim');
    const [t, v, id] = g.split(':');
    if (t === 'a') { APP.tab = 'admin'; if (v === 'login') { S.loggedIn = false; return; } S.loggedIn = true; ADM.view = v; ADM.id = id || null; return; }
    APP.tab = 'mobile'; MOB.back = [];
    if (t === 'mt') { MOB.role = 'tech'; MOB.screen = v; MOB.arg = null; return; }
    MOB.role = 'member'; MOB.screen = v; MOB.arg = v === 'station' || v === 'setup' ? 'ST-01' : null;
    if (v === 'setup') { MOB.budget = 0; MOB.budgetCustom = ''; MOB.budgetErr = ''; }
  },
  // mobile
  mrole: r => { MOB.role = r; MOB.back = []; MOB.screen = r === 'member' ? 'map' : 't-home'; MOB.arg = null; },
  mgo: (s, a) => mgo(s, a || null),
  mback: () => { const p = MOB.back.pop(); if (p) { MOB.screen = p[0]; MOB.arg = p[1]; } else MOB.screen = MOB.role === 'member' ? 'map' : 't-home'; },
  msel: id => MOB.sel = id,
  mfil: k => MOB.mapFilter = k,
  mcharge: () => { if (mySession()) return mgo('active'); const st = stById('ST-01'); if (st.status === 'READY' && st.lock !== 'LOCKED') mgo('setup', 'ST-01'); else { mgo('stations'); toast('SECO-01 đang bận', 'Chọn một trạm READY khác', 'info'); } },
  mbud: v => { MOB.budget = +v; MOB.budgetCustom = ''; MOB.budgetErr = ''; },
  mconfirm: stId => {
    const st = stById(stId); const me = ME();
    const b = MOB.budgetCustom !== '' ? Number(MOB.budgetCustom) : MOB.budget;
    if (!Number.isInteger(b) || b < 0) return void (MOB.budgetErr = 'Ngân sách phải là số nguyên dương.');
    if (b && b < 5) return void (MOB.budgetErr = 'Ngân sách tối thiểu 5đ (một chu kỳ 30 giây).');
    if (b > me.balance) return void (MOB.budgetErr = `Vượt quá số dư hiện có ${vnd(me.balance)}.`);
    if (me.balance < 5) return void (MOB.budgetErr = 'Số dư không đủ để sạc, vui lòng nạp thêm.');
    if (st.status !== 'READY' || st.lock === 'LOCKED' || !st.online) return void (MOB.budgetErr = `${st.code} hiện không sẵn sàng.`);
    MOB.budgetErr = ''; S.memberBudget = b || null;
    if (stId !== 'ST-01') { startSession(stId, 'MEMBER', me.id, S.memberBudget); S.memberBudget = null; mgo('active', null); toast('Demo', `${st.code} là trạm MOCK: phiên bắt đầu ngay`, 'info'); return; }
    mgo('waiting', stId);
  },
  mtop: v => MOB.topup = +v,
  mtopup: () => { const u = ME(); const amt = MOB.topup || 20000; const before = u.balance; u.balance += amt; S.transactions.unshift({ id: 'TX-' + (4000 + S.transactions.length), type: 'TOPUP_DEMO', userId: u.id, amount: amt, before, after: u.balance, status: 'SUCCESS', time: Date.now() }); toast('Nạp tiền thành công', `+${vnd(amt)} · số dư ${vnd(u.balance)}`, 'wallet'); ACT.mback(); if (MOB.screen !== 'setup') mgo('wallet', null, false); },
  mtxf: k => MOB.txFilter = k,
  mlogin: () => { MOB.back = []; MOB.screen = MOB.role === 'tech' ? 't-home' : 'map'; toast('Đăng nhập thành công', MOB.role === 'tech' ? 'Nguyễn Văn Tú · TECHNICIAN' : 'Trần Minh Anh · USER', 'log-in'); },
  mlogout: () => { MOB.back = []; MOB.screen = 'login'; },
  mchk: i => { MOB.checks[+i] = !MOB.checks[+i]; },
  // sim
  simrf: k => { simRFID(k); return 'norender'; },
  simplug: v => { simPlug(+v); return 'norender'; },
  simstart: () => { simStart(); return 'norender'; },
  simbud: d => { simBudget(+d); return 'norender'; },
  simestop: () => { simEstop(); return 'norender'; },
  simstopshort: () => { mqtt('ST-01', 'event', '{"type":"STOP_PRESSED"}'); flash('STOP: KHONG TAC', 'DUNG (CAN KTV 3S)'); return 'norender'; },
  simscan: () => { SIM.payView = true; },
  simpay: () => { if (SIM.payment) payPayment(SIM.payment); SIM.payView = false; SIM.plugged = true; flash('DA THANH TOAN', 'MOI RUT DAU CAM'); },
  simcancel: () => { const pi = SIM.payment; if (!pi) return; pi.status = 'CANCELLED'; SIM.payView = false; newQR(pi.sessionId); toast('Khách huỷ thanh toán', `${pi.id} CANCELLED · đã tạo mã mới`, 'alert-triangle'); },
  simexpire: () => { const pi = SIM.payment; if (!pi) return; pi.status = 'EXPIRED'; SIM.payView = false; mqtt('ST-01', 'event', JSON.stringify({ type: 'PAYMENT_EXPIRED', payment_id: pi.id })); },
  simnewqr: () => { const pi = SIM.payment; if (pi) newQR(pi.sessionId); },
  simclr: () => { SIM.receipt = null; },
};
function newQR(sessionId) {
  const s = sessById(sessionId);
  const pi = { id: 'PI-' + (1000 + S.payments.length), sessionId, amount: s.cost, status: 'PENDING', created: Date.now(), expires: Date.now() + 5 * MIN };
  S.payments.unshift(pi); SIM.payment = pi;
  mqtt('ST-01', 'res', JSON.stringify({ ok: true, payment_id: pi.id, amount_vnd: pi.amount, expires_in_s: 300 }), 'in');
}
const HOLD = {
  simstop: () => simStopLong(),
  tenter: stId => { const st = stById(stId); if (st.status !== 'ERROR') { toast('Không thể vào bảo trì', `${st.code} đang ${st.status}`, 'info'); return; }
    techToggle(stId, 'U-201'); if (stId === 'ST-01') SIM.tech = null; MOB.checks = [true, false, false, false]; MOB.notes = ''; MOB.parts = ''; mgo('t-maint', stId); renderAll(); },
  texit: stId => { const st = stById(stId); if (st.status !== 'MAINTENANCE') return;
    if (stId === 'ST-01' && SIM.estop) { SIM.estop = false; mqtt('ST-01', 'event', '{"type":"ESTOP_RELEASED"}'); }
    const mr = S.maint.find(m => m.station === stId && m.status === 'IN_PROGRESS');
    if (mr) { mr.action = MOB.notes.trim() || 'Kiểm tra theo checklist, khôi phục trạm'; mr.parts = MOB.parts.trim(); }
    techToggle(stId, 'U-201'); if (stId === 'ST-01') { SIM._tempFault = false; SIM.tempBase = Math.min(SIM.tempBase, 32); }
    mgo('t-report', mr ? mr.id : null); renderAll(); },
};

document.addEventListener('click', e => {
  const ov = e.target.closest('[data-close]'); if (ov && e.target === ov) return closeDlg();
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type !== 'checkbox') return;
  if (el.disabled) return;
  if (el.tagName === 'A' || el.closest('a')) e.preventDefault();
  const [a, ...args] = el.dataset.a.split('|');
  const f = ACT[a]; if (!f) return console.warn('no action', a);
  const r = f(...args);
  if (r !== 'norender') renderAll();
});
document.addEventListener('click', e => { if (e.target.closest('a[href="#"]')) e.preventDefault(); }, true);
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  const v = e.target.value;
  if (k === 'simtemp') { SIM.tempBase = +v; const b = e.target.nextElementSibling; if (b) b.textContent = v + '°C'; if (+v < 60) SIM._tempFault = false; return; }
  if (k === 'mnotes') MOB.notes = v;
  if (k === 'mparts') MOB.parts = v;
  if (k === 'mbudc') { MOB.budgetCustom = v.replace(/[^\d]/g, ''); MOB.budgetErr = MOB.budgetCustom && +MOB.budgetCustom > ME().balance ? `Vượt quá số dư ${vnd(ME().balance)}.` : ''; renderAll(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#overlay').innerHTML) return closeDlg();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.a === 'gsearch') {
    const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const st = S.stations.find(s => [s.id, s.code, s.name].some(x => x.toLowerCase().includes(q)));
    const ss = S.sessions.find(s => s.id.toLowerCase() === q || s.id.toLowerCase().includes(q));
    const u = S.users.find(x => [x.id, x.name, x.email].some(y => y.toLowerCase().includes(q)));
    if (ss && q.startsWith('ss')) ACT.open('session', ss.id); else if (st) ACT.open('station', st.id); else if (u) ACT.open('user', u.id); else if (ss) ACT.open('session', ss.id); else return toast('Không tìm thấy', `Không có kết quả cho “${e.target.value}”`, 'search');
    renderAll();
  }
  if (e.key === 'Enter' && e.target.closest('.dialog') && e.target.tagName === 'INPUT') { const b = $('#overlay .df .btn-primary, #overlay .df .btn-danger'); if (b) b.click(); }
});

/* hold-to-activate (3s) */
let _hold = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-hold]'); if (!el || el.disabled) return;
  e.preventDefault();
  const bar = el.querySelector('i'); if (bar) { bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth; bar.style.transition = 'width 3s linear'; bar.style.width = '100%'; }
  el.classList.add('holding');
  _hold = { el, bar, t0: Date.now(), timer: setTimeout(() => { const [a, arg] = el.dataset.hold.split('|'); endHold(false); HOLD[a] && HOLD[a](arg); }, 3000) };
});
function endHold(cancel = true) {
  if (!_hold) return; const h = _hold; _hold = null; clearTimeout(h.timer);
  if (h.bar) { h.bar.style.transition = 'width .2s'; h.bar.style.width = '0'; }
  h.el.classList.remove('holding');
  if (cancel && Date.now() - h.t0 < 3000 && h.el.dataset.short) { const f = ACT[h.el.dataset.short]; f && f(); }
}
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => endHold(true)));
document.addEventListener('pointerout', e => { if (_hold && e.target === _hold.el && !_hold.el.contains(e.relatedTarget)) endHold(true); });

/* ================= Loop ================= */
function loop() {
  try {
    tick();
    ADM.powerHist.push(+S.stations.reduce((a, s) => a + (s.p || 0), 0).toFixed(3));
    if (ADM.powerHist.length > 60) ADM.powerHist.shift();
  } catch (e) { console.error(e); }
  setTimeout(loop, 1000 / S.speed);
}
(function init() {
  for (let k = 0; k < 60; k++) ADM.powerHist.push(+(0.3 + (Math.sin(k / 6) * .08) + (Math.random() - .5) * .04).toFixed(3));
  const h = location.hash.replace('#', ''); if (TABS.some(t => t[0] === h)) APP.tab = h;
  renderAll();
  setTimeout(loop, 1000);
})();

</script>
