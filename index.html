<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SECO · Smart EV Charging — Screens, Screen Flow & Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#437066; --primary-600:#365c54; --primary-700:#2b4a43; --primary-50:#f0f5f3; --primary-100:#dde9e5; --primary-200:#bcd3cc;
  --bg:#ffffff; --surface:#ffffff; --muted:#f6f8f7; --muted-2:#eef2f0; --border:#e3e8e6; --border-strong:#cfd8d4;
  --fg:#15211e; --fg-2:#3a4a46; --muted-fg:#6a7a76; --ring:rgba(67,112,102,.35);
  --blue:#2e6fb7; --blue-50:#edf4fb; --amber:#b7791f; --amber-50:#fcf5e8; --red:#c8423f; --red-50:#fcefee; --green:#437066; --green-50:#eaf3f0; --gray:#8a9793; --gray-50:#f1f3f2;
  --radius:10px; --radius-sm:7px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(21,33,30,.06); --shadow:0 1px 3px rgba(21,33,30,.07),0 1px 2px rgba(21,33,30,.04); --shadow-lg:0 12px 32px -8px rgba(21,33,30,.18),0 4px 10px -4px rgba(21,33,30,.08);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1715;--surface:#16211e;--muted:#1b2724;--muted-2:#22302c;--border:#2a3a36;--border-strong:#34463f;--fg:#e8efec;--fg-2:#c3d0cb;--muted-fg:#8fa19b}}
:root[data-theme="dark"]{--bg:#0f1715;--surface:#16211e;--muted:#1b2724;--muted-2:#22302c;--border:#2a3a36;--border-strong:#34463f;--fg:#e8efec;--fg-2:#c3d0cb;--muted-fg:#8fa19b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke-width:1.9}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== App shell ===== */
.shell{display:flex;flex-direction:column;height:100%}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;height:56px;padding:0 20px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff}
.brand-mark svg{width:18px;height:18px}
.brand small{display:block;font-weight:500;color:var(--muted-fg);font-size:11.5px;line-height:1.1}
.tabs{display:flex;gap:2px;padding:3px;background:var(--muted);border:1px solid var(--border);border-radius:10px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:500;color:var(--muted-fg);white-space:nowrap;font-size:13.5px}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tab.on svg{color:var(--primary)}
.topbar .spacer{flex:1}
.pill-live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted-fg);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;flex:none}
.dot.pulse{box-shadow:0 0 0 0 rgba(67,112,102,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(67,112,102,.45)}70%{box-shadow:0 0 0 7px rgba(67,112,102,0)}100%{box-shadow:0 0 0 0 rgba(67,112,102,0)}}
.page{flex:1;min-height:0;overflow:auto}
.hidden{display:none!important}

/* ===== Primitives ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-600)}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--fg)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{background:transparent;color:var(--fg-2)}
.btn-ghost:hover{background:var(--muted)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(.94)}
.btn-soft{background:var(--primary-50);color:var(--primary-700)}
.btn-soft:hover{background:var(--primary-100)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn-lg{height:44px;padding:0 18px;font-size:14.5px;border-radius:10px}
.btn-icon{width:36px;padding:0}
.btn-sm.btn-icon{width:30px}
.btn[disabled]{opacity:.5;pointer-events:none}
.w-full{width:100%}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-h h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.005em}
.card-h p{margin:2px 0 0;color:var(--muted-fg);font-size:12.5px}
.card-b{padding:16px 18px}
.card-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;letter-spacing:.01em}
.badge .dot{width:6px;height:6px}
.b-ready{background:var(--green-50);color:var(--primary-700);border-color:#cfe2dc}.b-ready .dot{background:var(--primary)}
.b-charging{background:var(--blue-50);color:var(--blue);border-color:#cfe0f3}.b-charging .dot{background:var(--blue);animation:pulseb 1.6s infinite}
@keyframes pulseb{50%{opacity:.35}}
.b-error{background:var(--red-50);color:var(--red);border-color:#f3d0cf}.b-error .dot{background:var(--red)}
.b-maint{background:var(--amber-50);color:var(--amber);border-color:#f0dfbf}.b-maint .dot{background:var(--amber)}
.b-gray{background:var(--gray-50);color:#5d6b67;border-color:var(--border)}.b-gray .dot{background:var(--gray)}
.b-outline{background:var(--surface);color:var(--fg-2);border-color:var(--border)}

.input,.select{height:36px;width:100%;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
textarea.input{height:auto;padding:9px 11px;resize:vertical}
.label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;color:var(--fg-2)}
.field{margin-bottom:14px}
.hint{font-size:12px;color:var(--muted-fg);margin-top:5px}
.err{font-size:12px;color:var(--red);margin-top:5px}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-fg)}
.input-wrap .input{padding-left:32px}

.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--muted-fg);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--muted)}
.t td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{transition:background .12s}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:var(--primary-50)}
.t .r{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--muted-fg)}
.strong{font-weight:600}

.seg{display:inline-flex;padding:3px;background:var(--muted);border:1px solid var(--border);border-radius:9px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted-fg)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}

.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-100);color:var(--primary-700);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.avatar.lg{width:56px;height:56px;font-size:18px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;gap:16px}
.sep{height:1px;background:var(--border);margin:14px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px}
.kv dt{color:var(--muted-fg)}
.kv dd{margin:0;text-align:right;font-weight:500}

/* ===== Admin ===== */
.admin{display:grid;grid-template-columns:244px 1fr;height:100%;min-height:0}
.side{border-right:1px solid var(--border);background:var(--muted);padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column}
.side .grp{font-size:11.5px;font-weight:600;color:var(--muted-fg);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 10px;border-radius:8px;color:var(--fg-2);font-weight:500;font-size:13.5px;text-align:left}
.nav:hover{background:var(--muted-2);color:var(--fg)}
.nav.on{background:var(--surface);color:var(--primary-700);box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.nav.on svg{color:var(--primary)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;background:var(--red);color:#fff;border-radius:999px;padding:0 6px;line-height:18px}
.nav .cnt.soft{background:var(--primary-100);color:var(--primary-700)}
.side-foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--border)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.ahead{display:flex;align-items:center;gap:14px;height:60px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--surface);flex:none}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-fg)}
.crumb b{color:var(--fg);font-weight:600}
.crumb svg{width:14px;height:14px}
.acontent{flex:1;overflow:auto;padding:24px;background:linear-gradient(var(--bg),var(--bg))}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--muted-fg);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted-fg);font-size:12.5px;font-weight:500}
.kpi .k-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary)}
.kpi .k-v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .k-v small{font-size:14px;font-weight:500;color:var(--muted-fg);margin-left:3px}
.kpi .k-d{font-size:12px;color:var(--muted-fg);margin-top:2px}
.up{color:var(--primary);font-weight:600}
.down{color:var(--red);font-weight:600}
.g-2-1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.g-1-1{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mt{margin-top:16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--border)}
.toolbar .input-wrap{width:260px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px dashed var(--border-strong);border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--fg-2)}
.chip.on{border-style:solid;border-color:var(--primary);background:var(--primary-50);color:var(--primary-700)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted-fg)}

/* station live tiles */
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.st-tile{border:1px solid var(--border);border-radius:12px;padding:13px 14px;background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.st-tile:hover{border-color:var(--primary-200);box-shadow:var(--shadow)}
.st-tile .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.st-tile h4{margin:0;font-size:13.5px;font-weight:600}
.st-tile .sub{font-size:12px;color:var(--muted-fg)}
.st-tile .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.st-tile .m{background:var(--muted);border-radius:7px;padding:6px 8px}
.st-tile .m span{display:block;font-size:10.5px;color:var(--muted-fg)}
.st-tile .m b{font-size:13px;font-variant-numeric:tabular-nums;font-weight:600}
.feed{display:flex;flex-direction:column}
.feed-i{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.feed-i:last-child{border-bottom:0}
.feed-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.feed-ic svg{width:14px;height:14px}
.feed-i .t2{font-size:11.5px;color:var(--muted-fg)}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13px}
.legend .li{display:flex;align-items:center;gap:9px}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gauge{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface)}
.gauge .gl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted-fg);font-weight:500}
.gauge .gv{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gauge .gv small{font-size:13px;color:var(--muted-fg);font-weight:500;margin-left:3px}
.meter{height:6px;border-radius:999px;background:var(--muted-2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .4s}
.console{background:#14201d;color:#cfe1db;border-radius:10px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.7;height:250px;overflow:auto}
.console .tp{color:#8fc2b4}
.console .tm{color:#6d8580}
.console .ev{color:#f0c674}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmd{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:left;transition:border-color .15s,background .15s}
.cmd:hover{border-color:var(--primary-200);background:var(--primary-50)}
.cmd .ci{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--muted);flex:none}
.cmd b{display:block;font-size:13px;font-weight:600}
.cmd span{font-size:11.5px;color:var(--muted-fg)}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl{position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.tl.err::before{border-color:var(--red)}
.tl.warn::before{border-color:var(--amber)}
.tl b{font-size:13px;font-weight:600}
.tl p{margin:1px 0 0;font-size:12px;color:var(--muted-fg)}
.empty{padding:40px 20px;text-align:center;color:var(--muted-fg)}
.empty .ei{width:44px;height:44px;border-radius:12px;background:var(--muted);display:grid;place-items:center;margin:0 auto 10px;color:var(--muted-fg)}

.tabs-u{display:flex;gap:18px;border-bottom:1px solid var(--border);padding:0 18px}
.tabs-u button{border:0;background:transparent;padding:12px 0;font-weight:500;color:var(--muted-fg);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}
.tabs-u button.on{color:var(--fg);border-color:var(--primary)}

/* dialog / sheet / toast */
.overlay{position:fixed;inset:0;background:rgba(15,25,22,.42);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dialog{width:min(480px,100%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--border);animation:pop .18s ease-out;max-height:90vh;overflow:auto}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}}
.dialog .dh{padding:20px 22px 4px}
.dialog .dh h3{margin:0;font-size:17px;font-weight:600}
.dialog .dh p{margin:4px 0 0;color:var(--muted-fg);font-size:13px}
.dialog .db{padding:16px 22px}
.dialog .df{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:10px;align-items:flex-start;min-width:280px;max-width:380px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);border-radius:12px;padding:12px 14px;animation:pop .2s}
.toast .ti{color:var(--primary);margin-top:1px}
.toast b{font-size:13px;display:block}
.toast span{font-size:12.5px;color:var(--muted-fg)}
.scan-anim{width:88px;height:88px;border-radius:50%;margin:8px auto 14px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary);position:relative}
.scan-anim::before,.scan-anim::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary-200);animation:ripple 1.8s infinite}
.scan-anim::after{animation-delay:.9s}
@keyframes ripple{from{transform:scale(1);opacity:1}to{transform:scale(1.55);opacity:0}}
.scan-anim svg{width:34px;height:34px}

/* ===== Flow page ===== */
.flow-page{max-width:1240px;margin:0 auto;padding:32px 24px 60px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;margin-bottom:34px}
.hero h1{font-size:34px;line-height:1.15;margin:0 0 10px;letter-spacing:-.025em;font-weight:700}
.hero p{margin:0;color:var(--fg-2);font-size:15px;max-width:60ch}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hs{border:1px solid var(--border);border-radius:12px;padding:14px}
.hs b{display:block;font-size:24px;letter-spacing:-.02em}
.hs span{font-size:12.5px;color:var(--muted-fg)}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 14px}
.sec-t h2{margin:0;font-size:19px;letter-spacing:-.015em}
.sec-t p{margin:0;color:var(--muted-fg);font-size:13px}
.lane{border:1px solid var(--border);border-radius:16px;padding:18px 18px 20px;margin-bottom:14px;background:var(--surface)}
.lane-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lane-h .li{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.lane-h h3{margin:0;font-size:15px}
.lane-h p{margin:0;font-size:12.5px;color:var(--muted-fg)}
.flow{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.fnode{flex:none;min-width:132px;max-width:168px;border:1px solid var(--border);border-radius:11px;padding:10px 12px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s;text-align:left}
.fnode:hover{border-color:var(--primary);background:var(--primary-50)}
.fnode .fid{font-size:10.5px;font-weight:600;color:var(--primary)}
.fnode b{display:block;font-size:13px;margin-top:1px;line-height:1.3}
.fnode span{display:block;font-size:11.5px;color:var(--muted-fg);margin-top:3px;line-height:1.35}
.fnode.alt{border-style:dashed}
.fnode.danger .fid{color:var(--red)}
.farrow{flex:none;width:30px;display:grid;place-items:center;color:var(--border-strong)}
.farrow svg{width:16px;height:16px}
.fbranch{display:flex;flex-direction:column;gap:8px;flex:none}
.fstack{display:flex;flex-direction:column;gap:8px;flex:none}
.branch-note{font-size:12px;color:var(--muted-fg);margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.branch-note svg{margin-top:2px;color:var(--amber)}
.fsm{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.inv td{white-space:normal}
.inv .scrlink{border:0;background:none;padding:0;color:var(--primary);font-weight:600;cursor:pointer}

/* ===== Mobile ===== */
.mob-page{display:grid;grid-template-columns:300px 1fr 300px;gap:28px;max-width:1240px;margin:0 auto;padding:24px}
.mnav{display:flex;flex-direction:column;gap:2px}
.mnav .grp{font-size:11.5px;font-weight:600;color:var(--muted-fg);padding:12px 10px 5px}
.mnav button{display:flex;gap:10px;align-items:center;border:0;background:transparent;padding:7px 10px;border-radius:8px;text-align:left;font-size:13px;color:var(--fg-2)}
.mnav button:hover{background:var(--muted)}
.mnav button.on{background:var(--primary-50);color:var(--primary-700);font-weight:600}
.mnav button .sid{font-size:10.5px;color:var(--muted-fg);font-weight:600;min-width:46px}
.mnav button.on .sid{color:var(--primary)}
.phone-wrap{display:flex;justify-content:center;align-items:flex-start;padding-top:4px}
.phone{width:380px;height:800px;border-radius:52px;background:#0e1513;padding:11px;box-shadow:0 30px 60px -20px rgba(21,33,30,.35),0 0 0 1px #2a3a36 inset;position:relative;flex:none}
.phone::after{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:108px;height:30px;border-radius:20px;background:#0e1513;z-index:5}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:#fff;position:relative;display:flex;flex-direction:column;color:#15211e}
.sbar{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:13.5px;font-weight:600;flex:none;position:relative;z-index:4}
.sbar .ic{display:flex;gap:5px;align-items:center}
.sbar svg{width:15px;height:15px}
.mbody{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.mbody::-webkit-scrollbar{display:none}
.mtab{height:78px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px 22px;flex:none;background:#fff}
.mtab button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted-fg);font-weight:500}
.mtab button svg{width:21px;height:21px}
.mtab button.on{color:var(--primary)}
.mtab button.cta{color:#fff}
.mtab button.cta span.cb{width:44px;height:44px;border-radius:14px;background:var(--primary);display:grid;place-items:center;margin-top:-14px;box-shadow:0 6px 14px -4px rgba(67,112,102,.6)}
.mtab button.cta em{font-style:normal;color:var(--primary);font-weight:600}
.mh{display:flex;align-items:center;gap:10px;padding:6px 18px 12px}
.mh h2{margin:0;font-size:19px;letter-spacing:-.015em;flex:1}
.mh .back{width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:#fff;display:grid;place-items:center}
.mpad{padding:0 18px 22px}
.mcard{border:1px solid var(--border);border-radius:16px;padding:14px;background:#fff}
.msec{font-size:13px;font-weight:600;margin:18px 0 9px;display:flex;justify-content:space-between;align-items:center}
.msec a,.msec button{font-size:12.5px;font-weight:500;color:var(--primary);border:0;background:none}
.list-i{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.list-i:last-child{border-bottom:0}
.list-i .lic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.list-i .lic svg{width:18px;height:18px}
.list-i .lt{flex:1;min-width:0}
.list-i .lt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-i .lt span{font-size:12px;color:var(--muted-fg)}
.list-i .lr{text-align:right;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.list-i .lr span{display:block;font-size:11.5px;font-weight:500;color:var(--muted-fg)}
.map{position:relative;height:100%;background:#eef1ea}
.map svg.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.pin .pb{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 4px 10px -2px rgba(0,0,0,.3);border:2.5px solid #fff}
.pin .pb svg{transform:rotate(45deg);width:15px;height:15px;color:#fff}
.pin.sel .pb{width:42px;height:42px}
.map-top{position:absolute;top:8px;left:14px;right:14px;z-index:3;display:flex;flex-direction:column;gap:8px}
.msearch{display:flex;align-items:center;gap:9px;height:46px;background:#fff;border-radius:14px;padding:0 14px;box-shadow:0 6px 18px -6px rgba(0,0,0,.18);font-size:13.5px;color:var(--muted-fg)}
.mchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mchips button{flex:none;border:0;background:#fff;height:30px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;box-shadow:0 3px 10px -4px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px;color:var(--fg-2)}
.mchips button.on{background:var(--primary);color:#fff}
.bsheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -12px rgba(0,0,0,.2);padding:8px 16px 14px}
.grab{width:38px;height:4px;border-radius:4px;background:var(--border-strong);margin:0 auto 10px}
.wallet-card{border-radius:20px;padding:18px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#5d8e83 0%,#437066 45%,#2b4a43 100%);position:relative;overflow:hidden}
.wallet-card::after{content:"";position:absolute;right:-30px;bottom:-50px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.07)}
.wallet-card .wl{font-size:12.5px;opacity:.85}
.wallet-card .wv{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.wallet-card .wr{display:flex;gap:18px;font-size:12px;opacity:.9}
.wallet-card .wr b{display:block;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa button{border:1px solid var(--border);background:#fff;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--fg-2)}
.qa button span{width:34px;height:34px;border-radius:11px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center}
.qa button svg{width:17px;height:17px}
.ring-wrap{position:relative;width:236px;height:236px;margin:6px auto 2px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c .rv{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring-c .rl{font-size:12px;color:var(--muted-fg)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--muted);border-radius:12px;padding:10px}
.stat3 span{display:block;font-size:11px;color:var(--muted-fg)}
.stat3 b{font-size:15px;font-variant-numeric:tabular-nums}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.presets button{border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 6px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.presets button span{display:block;font-size:11px;color:var(--muted-fg);font-weight:500}
.presets button.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary-700);box-shadow:0 0 0 1px var(--primary) inset}
.step{display:flex;gap:12px;padding:10px 0}
.step .sn{width:26px;height:26px;border-radius:50%;background:var(--muted-2);color:var(--muted-fg);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.step.done .sn{background:var(--primary);color:#fff}
.step.cur .sn{background:var(--primary-100);color:var(--primary-700);box-shadow:0 0 0 3px var(--primary-50)}
.step b{font-size:13.5px;display:block}
.step span{font-size:12px;color:var(--muted-fg)}
.mbtn-bar{padding:12px 18px 16px;border-top:1px solid var(--border);background:#fff;flex:none}
.hero-m{padding:18px;border-radius:20px;background:var(--primary-50);border:1px solid var(--primary-100)}
.m-note{font-size:12px;color:var(--muted-fg);background:var(--muted);border-radius:12px;padding:10px 12px;display:flex;gap:8px}
.m-note svg{flex:none;margin-top:2px;color:var(--primary)}
.spec{padding:18px;border:1px solid var(--border);border-radius:14px}
.spec h4{margin:0 0 2px;font-size:15px}
.spec .sid{font-size:11.5px;font-weight:600;color:var(--primary)}
.spec p{font-size:13px;color:var(--fg-2);margin:8px 0 0}
.spec ul{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--fg-2)}
.spec ul li{margin:3px 0}
.uc{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.hold-btn{position:relative;overflow:hidden}
.hold-btn i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.25);width:0}

/* ===== Station simulator ===== */
.sim-page{max-width:1240px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px}
.device{border-radius:26px;background:linear-gradient(160deg,#4f7d72,#2d4c45);padding:22px;color:#fff;box-shadow:var(--shadow-lg);position:relative}
.device-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.device-top .dn{font-weight:700;font-size:15px;display:flex;gap:9px;align-items:center}
.device-top .dn small{font-weight:500;opacity:.75;font-size:12px}
.leds{display:flex;gap:10px;align-items:center;font-size:11px;opacity:.95}
.led{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.15);display:inline-block;margin-right:4px;vertical-align:-1px}
.led.g.on{background:#6ee7a8;box-shadow:0 0 10px #6ee7a8}
.led.y.on{background:#ffd166;box-shadow:0 0 10px #ffd166}
.led.r.on{background:#ff6b6b;box-shadow:0 0 10px #ff6b6b}
.lcd{background:#9fc36b;border-radius:10px;padding:14px 16px;border:6px solid #1e2d29;box-shadow:inset 0 0 14px rgba(0,0,0,.25);font-family:ui-monospace,"Courier New",monospace;color:#1d2a10;font-size:22px;line-height:1.35;letter-spacing:.14em;white-space:pre;font-weight:700;overflow:hidden}
.lcd.off{background:#56693a;color:#3e4d2a}
.dev-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:16px}
.panel{background:rgba(0,0,0,.16);border-radius:16px;padding:14px}
.panel h5{margin:0 0 10px;font-size:12px;font-weight:600;opacity:.8}
.dbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dbtn{border:0;border-radius:12px;padding:10px 6px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .15s,transform .05s}
.dbtn:hover{background:rgba(255,255,255,.2)}
.dbtn:active{transform:scale(.97)}
.dbtn svg{width:18px;height:18px}
.dbtn.start{background:#e8f5ef;color:#2b4a43}
.dbtn.stop{background:#f4d9a0;color:#5b3d05;position:relative;overflow:hidden}
.dbtn.stop i{position:absolute;left:0;bottom:0;height:4px;background:#8a5a00;width:0}
.estop{width:92px;height:92px;border-radius:50%;background:#f2c94c;display:grid;place-items:center;border:0;box-shadow:0 4px 0 #b58f1c;flex:none}
.estop span{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a73,#c8231d);box-shadow:0 4px 0 #8f1410,inset 0 -4px 6px rgba(0,0,0,.2);display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;letter-spacing:.06em}
.estop.on span{transform:translateY(3px);box-shadow:0 1px 0 #8f1410}
.cards-rf{display:flex;flex-direction:column;gap:7px}
.rf{display:flex;align-items:center;gap:10px;border:0;border-radius:11px;padding:8px 10px;background:rgba(255,255,255,.12);color:#fff;text-align:left;font-size:12.5px}
.rf:hover{background:rgba(255,255,255,.22)}
.rf .rfc{width:34px;height:22px;border-radius:4px;flex:none;background:linear-gradient(135deg,#fff,#cfe1db)}
.rf b{display:block;font-size:12.5px}
.rf span{font-size:11px;opacity:.75}
.plug{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.switch{width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.25);border:0;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:#6ee7a8}
.switch.on::after{left:23px}
.hw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.hw div{background:rgba(0,0,0,.18);border-radius:11px;padding:8px 10px;font-size:11px}
.hw b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.range{width:100%;accent-color:#ffd166}
.sim-right{display:flex;flex-direction:column;gap:16px}
.qr{width:170px;height:170px;margin:4px auto;display:block}
.budget-step{display:flex;align-items:center;gap:8px}
.budget-step button{width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;font-weight:700}
.budget-step b{flex:1;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.speed{display:flex;gap:4px}
.speed button{border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:11.5px;font-weight:600;padding:4px 8px}
.speed button.on{background:#fff;color:#2b4a43}

@media (max-width:1200px){.mob-page{grid-template-columns:240px 1fr}.mob-page .specwrap{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:980px){.admin{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:6px 8px;gap:2px}.side .grp,.side .side-foot{display:none}.side .nav{white-space:nowrap;width:auto;flex:none}.g-2-1,.g-1-1,.g-3,.hero,.fsm,.sim-page{grid-template-columns:1fr}.gauges{grid-template-columns:repeat(2,1fr)}.mob-page{grid-template-columns:1fr}.mnav{flex-direction:row;overflow-x:auto}.mnav .grp{display:none}.dev-grid{grid-template-columns:1fr}.pill-live{display:none}}
@media (max-width:640px){.topbar{padding:0 12px;gap:10px}.brand small,.brand span.bt{display:none}.tab span{display:none}.acontent{padding:16px}.kpis{grid-template-columns:1fr 1fr}.phone{transform:scale(.86);transform-origin:top center;margin-bottom:-110px}}

@media (max-width:640px){.sim-page>*,.sim-right,.device,.panel{min-width:0}.device{padding:14px}.lcd{font-size:15px;letter-spacing:.08em}.device-top{flex-wrap:wrap;gap:8px}.leds{flex-wrap:wrap}.brand>div{display:none}.phone{transform:scale(.92)}.ahead .input-wrap{display:none}.mob-page{padding:12px}}

body{display:flex;flex-direction:column;min-height:100vh}
.views{flex:1;min-height:0}
#view-admin{height:calc(100vh - 56px)}
#view-admin[hidden],#view-flow[hidden],#view-mobile[hidden],#view-sim[hidden]{display:none}
.mono,code{font-family:"JetBrains Mono",ui-monospace,monospace}
.topbar .tstat{display:flex;align-items:center;gap:10px}
@media (max-width:900px){.topbar .tstat{display:none}.brand small{display:none}}
</style>

function startSession(stId, type, userId, budget) {
  const st = stById(stId);
  const s = { id: 'SS-' + (2100 + S.sessions.length), station: stId, type, userId, budget: budget || null, start: Date.now(), ticks: 0, energy: 0, cost: 0, price: S.price, status: 'ACTIVE', series: [] };
  S.sessions.unshift(s); st.session = s; st.status = 'CHARGING'; st.relay = true;
  mqtt(stId, 'req', JSON.stringify({ action: 'session_start', type, user_id: userId, max_budget_vnd: s.budget }));
  mqtt(stId, 'res', JSON.stringify({ ok: true, session_id: s.id, price_per_kwh_vnd: S.price }), 'in');
  mqtt(stId, 'event', '{"type":"CHARGE_STARTED"}');
  toast('Phiên sạc bắt đầu', `${s.id} · ${st.code} · ${type}`);
  return s;
}

function stopSession(stId, reason) {
  const st = stById(stId), s = st.session; if (!s) return;
  s.end = Date.now(); s.stopReason = reason; st.relay = false; st.i = 0; st.p = 0; st.session = null;
  mqtt(stId, 'event', JSON.stringify({ type: 'CHARGE_STOPPED', reason }));
  mqtt(stId, 'req', JSON.stringify({ action: 'session_end', session_id: s.id, energy_kwh: +s.energy.toFixed(5), cost_vnd: s.cost, stop_reason: reason }));
  const safety = ['E_STOP', 'OVER_TEMPERATURE', 'SYSTEM_ERROR'].includes(reason);
  if (s.type === 'MEMBER') {
    const u = userById(s.userId);
    const before = u.balance; u.balance = Math.max(0, u.balance - s.cost);
    s.status = 'COMPLETED'; s.balanceBefore = before; s.balanceAfter = u.balance;
    if (s.cost > 0) S.transactions.unshift({ id: 'TX-' + (4000 + S.transactions.length), type: 'CHARGE_DEDUCTION', userId: u.id, sessionId: s.id, amount: -s.cost, before, after: u.balance, status: 'SUCCESS', time: Date.now() });
    mqtt(stId, 'res', JSON.stringify({ ok: true, session: 'COMPLETED', balance_vnd: u.balance }), 'in');
    if (stId === 'ST-01') SIM.auth = null;
    if (u.id === 'U-001') { S.lastResult = s; if (MOB.role === 'member' && ['active', 'waiting', 'setup'].includes(MOB.screen)) { MOB.screen = 'result'; } }
    st.status = safety ? 'ERROR' : 'READY';
  } else {
    if (s.cost > 0) {
      s.status = 'WAITING_PAYMENT';
      mqtt(stId, 'cmd', '{"action":"LOCK"}', 'in');
      st.lock = 'LOCKED';
      mqtt(stId, 'cmd_ack', '{"action":"LOCK","lock":"LOCKED"}');
      const pi = { id: 'PI-' + (1000 + S.payments.length), sessionId: s.id, amount: s.cost, status: 'PENDING', created: Date.now(), expires: Date.now() + 5 * MIN };
      S.payments.unshift(pi);
      if (stId === 'ST-01') { SIM.payment = pi; SIM.receipt = null; }
    } else s.status = 'COMPLETED';
    st.status = safety ? 'ERROR' : 'READY';
  }
  if (safety) raiseFault(stId, reason === 'E_STOP' ? 'E_STOP' : reason === 'OVER_TEMPERATURE' ? 'OVER_TEMPERATURE' : 'SENSOR_FAULT', s.id);
  toast('Phiên sạc kết thúc', `${s.id} · ${STOP_LABEL[reason]} · ${vnd(s.cost)}`, reason === 'UNPLUG' || reason === 'MAX_BUDGET' ? 'check-circle' : 'alert-triangle');
}

function raiseFault(stId, type, sessionId) {
  const st = stById(stId);
  const val = type === 'OVER_TEMPERATURE' ? st.temp.toFixed(1) + '°C (ngưỡng 60°C)' : type === 'E_STOP' ? 'E-Stop nhấn' : '—';
  S.faults.unshift({ id: 'ERR-' + (420 + S.faults.length), station: stId, type, severity: type === 'OVER_TEMPERATURE' ? 'CRITICAL' : 'HIGH', value: val, msg: type === 'E_STOP' ? 'Relay cắt cứng, trạm chuyển ERROR' : 'Relay cắt tự động, trạm chuyển ERROR', time: Date.now(), status: 'OPEN', session: sessionId });
  st.status = 'ERROR';
  mqtt(stId, 'event', JSON.stringify({ type: 'FAULT', code: type }));
}

function payPayment(pi) {
  pi.status = 'PAID'; pi.paidAt = Date.now();
  const s = sessById(pi.sessionId); s.status = 'COMPLETED';
  S.transactions.unshift({ id: 'TX-' + (4000 + S.transactions.length), type: 'GUEST_PAYMENT', userId: null, sessionId: s.id, amount: pi.amount, before: null, after: null, status: 'SUCCESS', time: Date.now(), ref: pi.id });
  const st = stById(s.station);
  mqtt(st.id, 'cmd', '{"action":"UNLOCK"}', 'in');
  st.lock = 'UNLOCKED';
  mqtt(st.id, 'cmd_ack', '{"action":"UNLOCK","lock":"UNLOCKED"}');
  if (st.id === 'ST-01') { SIM.receipt = { session: s, payment: pi }; SIM.payment = null; }
  toast('Đã thanh toán', `${pi.id} · ${vnd(pi.amount)} · đầu cắm đã mở khoá`, 'check-circle');
}

function techToggle(stId, techId = 'U-201') {
  const st = stById(stId); const tech = userById(techId);
  if (st.status === 'ERROR') {
    st.status = 'MAINTENANCE';
    S.faults.filter(f => f.station === stId && f.status === 'OPEN').forEach(f => f.status = 'IN_PROGRESS');
    S.maint.unshift({ id: 'MR-' + String(108 + S.maint.length).padStart(4, '0'), station: stId, fault: (S.faults.find(f => f.station === stId && f.status === 'IN_PROGRESS') || {}).id, tech: techId, start: Date.now(), end: null, status: 'IN_PROGRESS', action: '', parts: '' });
    mqtt(stId, 'req', JSON.stringify({ action: 'maintenance_enter', tech_id: techId }));
    audit('MAINTENANCE_ENTER', stId, 'RFID KTV + STOP 3s', tech.name, 'TECHNICIAN');
    toast('Trạm chuyển MAINTENANCE', `${st.code} · KTV ${tech.name}`, 'wrench');
    return 'MAINTENANCE';
  }
  if (st.status === 'MAINTENANCE') {
    st.status = 'READY'; if (stId !== 'ST-01') st.temp = 30 + Math.random() * 3; else SIM.tempBase = 31.4;
    S.faults.filter(f => f.station === stId && f.status !== 'RESOLVED').forEach(f => f.status = 'RESOLVED');
    const mr = S.maint.find(m => m.station === stId && m.status === 'IN_PROGRESS');
    if (mr) { mr.status = 'COMPLETED'; mr.end = Date.now(); if (!mr.action) mr.action = 'Kiểm tra và khôi phục trạm'; }
    if (stId === 'ST-05') st.v = 12.06;
    mqtt(stId, 'req', JSON.stringify({ action: 'maintenance_exit', tech_id: techId }));
    audit('MAINTENANCE_EXIT', stId, 'Trạm về READY', tech.name, 'TECHNICIAN');
    toast('Trạm hoạt động trở lại', `${st.code} · READY`, 'check-circle');
    return 'READY';
  }
  return null;
}

/* ================= Tick ================= */
function tick() {
  S.stations.forEach(st => {
    if (!st.online) return;
    if (st.id === 'ST-01') st.temp = +(SIM.tempBase + (st.status === 'CHARGING' ? 3.5 : 0) + (Math.random() - .5) * .4).toFixed(1);
    else if (st.status !== 'ERROR') st.temp = +clamp(st.temp + (st.status === 'CHARGING' ? .05 : -.05) + (Math.random() - .5) * .3, 27, 45).toFixed(1);
    if (st.status === 'CHARGING' && st.session) {
      const s = st.session;
      st.v = +(12.02 + Math.random() * .08).toFixed(2); st.i = +(12.3 + Math.random() * .3).toFixed(2); st.p = +(st.v * st.i / 1000).toFixed(3);
      s.ticks++; s.energy = s.ticks * TICK_KWH; s.cost = Math.round(s.energy * s.price); (s.series || (s.series = [])).push(s.energy);
      if (s.series.length > 400) s.series.shift();
      if (s.ticks % 2 === 0) mqtt(st.id, 'telemetry', JSON.stringify({ v: st.v, i: st.i, p_kw: st.p, e_kwh: +s.energy.toFixed(5), t: st.temp }));
      if (st.temp >= 60) { stopSession(st.id, 'OVER_TEMPERATURE'); return renderAll(); }
      const nextCost = Math.round((s.ticks + 1) * TICK_KWH * s.price);
      if (s.budget && nextCost > s.budget) { stopSession(st.id, 'MAX_BUDGET'); return renderAll(); }
      if (s.type === 'MEMBER') { const u = userById(s.userId); if (nextCost > u.balance) { stopSession(st.id, 'INSUFFICIENT_BALANCE'); return renderAll(); } }
    } else if (st.status !== 'MAINTENANCE') { st.v = +(12.03 + Math.random() * .06).toFixed(2); st.i = 0; st.p = 0; }
    if (st.id === 'ST-01' && st.temp >= 60 && st.status === 'READY' && !SIM._tempFault) { SIM._tempFault = true; raiseFault('ST-01', 'OVER_TEMPERATURE'); renderAll(); }
  });
  // mock stations: keep them lively (restart budget-hit mock ST-02 later)
  const s2 = stById('ST-02');
  if (s2.status === 'READY' && !s2.session && Math.random() < .02) { startSession('ST-02', 'MEMBER', 'U-002', 500); renderAll(); }
  if (SIM.payment && SIM.payment.status === 'PENDING' && Date.now() > SIM.payment.expires) { SIM.payment.status = 'EXPIRED'; renderAll(); }
  fillFrags();
}

/* ================= SVG charts ================= */
function areaChart(vals, { h = 200, color = '#437066', labels = [], fmt = v => v, yTicks = 4, fill = true, min = 0 } = {}) {
  const W = 640, H = h, pl = 44, pr = 10, pt = 10, pb = labels.length ? 26 : 10;
  const max = Math.max(...vals, min + 1e-9) * 1.12 || 1; const n = Math.max(vals.length - 1, 1);
  const X = i => pl + (W - pl - pr) * i / n, Y = v => pt + (H - pt - pb) * (1 - (v - min) / (max - min));
  let g = '';
  for (let k = 0; k <= yTicks; k++) { const v = min + (max - min) * k / yTicks, y = Y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="${k ? '3 4' : ''}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--muted-fg)">${fmt(v)}</text>`; }
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const step = Math.ceil(labels.length / 8);
  const lx = labels.map((l, i) => i % step === 0 ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted-fg)">${l}</text>` : '').join('');
  const id = 'g' + Math.random().toString(36).slice(2, 7);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;height:${h}px">
  <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  ${g}${fill && vals.length > 1 ? `<polygon points="${X(0)},${Y(min)} ${pts} ${X(vals.length - 1)},${Y(min)}" fill="url(#${id})"/>` : ''}
  <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${lx}</svg>`;
}
function barChart(vals, labels, { h = 220, color = '#437066', fmt = v => v, hi = -1 } = {}) {
  const W = 640, H = h, pl = 50, pr = 8, pt = 12, pb = 26; const max = Math.max(...vals) * 1.15 || 1;
  const bw = (W - pl - pr) / vals.length; let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4, y = pt + (H - pt - pb) * (1 - k / 4); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="${k ? '3 4' : ''}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--muted-fg)">${fmt(v)}</text>`; }
  const bars = vals.map((v, i) => { const bh = (H - pt - pb) * v / max, x = pl + bw * i + bw * .22, y = H - pb - bh; return `<rect x="${x}" y="${y}" width="${bw * .56}" height="${bh}" rx="5" fill="${i === hi ? color : color}" opacity="${i === hi ? 1 : .55}"><title>${labels[i]}: ${fmt(v)}</title></rect><text x="${x + bw * .28}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted-fg)">${labels[i]}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;height:auto">${g}${bars}</svg>`;
}
function donut(segs, size = 150, label = '', sub = '') {
  const r = 56, c = 2 * Math.PI * r; const tot = segs.reduce((a, s) => a + s.v, 0) || 1; let off = 0;
  const arcs = segs.map(s => { const len = c * s.v / tot; const a = `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(len - 2, 0)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off += len; return a; }).join('');
  return `<svg viewBox="0 0 150 150" width="${size}" height="${size}"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--muted-2)" stroke-width="16"/>${arcs}<text x="75" y="74" text-anchor="middle" font-size="24" font-weight="700" fill="var(--fg)">${label}</text><text x="75" y="93" text-anchor="middle" font-size="10.5" fill="var(--muted-fg)">${sub}</text></svg>`;
}
function spark(vals, color = '#437066', w = 90, h = 28) {
  if (vals.length < 2) return ''; const max = Math.max(...vals), min = Math.min(...vals), rng = max - min || 1;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${color}" stroke-width="1.8" points="${vals.map((v, i) => `${(w * i / (vals.length - 1)).toFixed(1)},${(h - 3 - (h - 6) * (v - min) / rng).toFixed(1)}`).join(' ')}"/></svg>`;
}

        ${[['LOCK', 'lock', 'Khoá đầu cắm', 'var(--amber)'], ['UNLOCK', 'lock-open', 'Mở khoá đầu cắm', 'var(--primary)'], ['STOP', 'square', 'Dừng phiên từ xa', 'var(--red)'], ['MAINTENANCE', 'wrench', 'Chuyển bảo trì', 'var(--amber)'], ['RESET', 'rotate-ccw', 'Khởi động lại', 'var(--blue)'], ['PING', 'radio', 'Kiểm tra kết nối', 'var(--primary)']].map(([c, ic, l, col]) => `<button class="cmd" data-a="cmd|${st.id}|${c}"><span class="ci" style="color:${col}">${I(ic)}</span><div><b>${c}</b><span>${l}</span></div></button>`).join('')}

AV.session = () => {
  const s = sessById(ADM.id); if (!s) return '';
  const st = stById(s.station); const u = s.userId && userById(s.userId);
  const pis = S.payments.filter(p => p.sessionId === s.id); const tx = S.transactions.find(t => t.sessionId === s.id);
  const series = s.series && s.series.length > 1 ? s.series : Array.from({ length: Math.min(s.ticks, 120) }, (_, i) => (i + 1) * s.energy / Math.min(s.ticks, 120));
  const ev = [[s.start, s.type === 'MEMBER' ? 'RFID xác thực thành công' : 'Nhấn START (Guest)', s.type === 'MEMBER' ? `UID ${S.cards.find(c => c.userId === s.userId)?.uid || '—'} · ${u?.name}` : 'Không cần RFID, không có ví', ''], [s.start + 1500, 'session_start', `Backend tạo ${s.id}, relay ON`, ''], [s.start + 3000, 'CHARGE_STARTED', `evcs/${s.station}/event`, '']];
  if (s.end) ev.push([s.end, 'CHARGE_STOPPED · ' + s.stopReason, STOP_LABEL[s.stopReason], ['E_STOP', 'OVER_TEMPERATURE'].includes(s.stopReason) ? 'err' : '']);

  <div class="g-1-1 mt"><div class="card"><div class="card-h"><h3>Dòng sự kiện</h3></div><div class="card-b"><div class="timeline">${ev.sort((a, b) => a[0] - b[0]).map(e => `<div class="tl ${e[3]}"><b>${esc(e[1])}</b><p>${fTimeS(e[0])} · ${esc(e[2])}</p></div>`).join('')}</div></div></div>

    (tx ? `<table class="t"><thead><tr><th>Giao dịch</th><th class="r">Số tiền</th><th class="r">Trước</th><th class="r">Sau</th><th>Trạng thái</th></tr></thead><tbody><tr><td class="mono">${tx.id}</td><td class="r num" style="color:var(--red)">${vnd(tx.amount)}</td><td class="r num">${vnd(tx.before)}</td><td class="r num">${vnd(tx.after)}</td><td>${badge('b-ready', tx.status, false)}</td></tr></tbody></table>` : `<div class="empty">Giao dịch được ghi khi phiên kết thúc</div>`)}
  </div></div></div>`;

MS.setup = () => {
  const st = stById(MOB.arg || 'ST-01'); const me = ME();
  const presets = [[0, 'Không giới hạn', 'tới khi rút'], [50, vnd(50), '≈ 5 phút'], [100, vnd(100), '≈ 10 phút'], [200, vnd(200), '≈ 20 phút'], [500, vnd(500), '≈ 50 phút'], [1000, vnd(1000), '≈ 1g 40p']];
  const b = MOB.budgetCustom !== '' ? +MOB.budgetCustom : MOB.budget;
  const ticks = b ? Math.floor(b / 5) : 0;
  return `${mhead('Thiết lập phiên sạc')}<div class="mbody"><div class="mpad">
  <div class="mcard row" style="gap:12px"><span class="lic" style="width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary)">${I('zap')}</span><div style="flex:1"><b>${st.code} · ${esc(st.name)}</b><div class="muted" style="font-size:12px">${vnd(S.price)}/kWh · 5đ mỗi 30 giây</div></div>${stBadge(st)}</div>
  <div class="mcard" style="margin-top:10px;display:flex;justify-content:space-between;align-items:center"><div><div class="muted" style="font-size:12px">Số dư khả dụng</div><b style="font-size:18px" class="num">${vnd(me.balance)}</b></div><button class="btn btn-soft btn-sm" data-a="mgo|topup">${I('plus')}Nạp</button></div>
  <div class="msec">Ngân sách tối đa <span class="muted" style="font-weight:500;font-size:12px">tuỳ chọn</span></div>
  <div class="presets">${presets.map(([v, l, d]) => `<button class="${MOB.budgetCustom === '' && MOB.budget === v ? 'on' : ''}" data-a="mbud|${v}">${l}<span>${d}</span></button>`).join('')}</div>
  <div class="field" style="margin-top:12px"><label class="label">Hoặc nhập số tiền (VND)</label><input class="input num" style="height:46px;border-radius:12px" inputmode="numeric" placeholder="Ví dụ 300" value="${esc(MOB.budgetCustom)}" data-in="mbudc">${MOB.budgetErr ? `<div class="err">${MOB.budgetErr}</div>` : `<div class="hint">Phải nhỏ hơn hoặc bằng số dư ${vnd(me.balance)}</div>`}</div>
  <div class="mcard" style="background:var(--muted);border:0"><div class="between" style="font-size:13px"><span class="muted">Ước tính</span><b>${b ? `${durTicks(ticks)} · ${kwh(ticks * TICK_KWH, 4)} kWh` : 'Sạc tới khi rút hoặc hết số dư'}</b></div></div>
  </div></div><div class="mbtn-bar"><button class="btn btn-primary btn-lg w-full" style="border-radius:13px" data-a="mconfirm|${st.id}">Xác nhận và tới trạm</button></div>`;
};

MS.waiting = () => {
  const auth = SIM.auth && SIM.auth.id === 'U-001'; const s = mySession();
  const step = s ? 3 : auth && SIM.plugged ? 3 : auth ? 2 : 1;
  const cls = n => n < step ? 'done' : n === step ? 'cur' : '';
  return `${mhead('Bắt đầu tại trạm')}<div class="mbody"><div class="mpad" style="text-align:center">
  <div class="scan-anim" style="margin-top:14px">${I(step === 1 ? 'nfc' : step === 2 ? 'plug' : 'zap')}</div>
  <h3 style="margin:0 0 4px;font-size:19px">${step === 1 ? 'Quẹt thẻ RFID tại SECO-01' : step === 2 ? 'Cắm sạc vào xe' : 'Đang khởi tạo phiên…'}</h3>
  <p class="muted" style="margin:0 0 18px;font-size:13px">${step === 1 ? 'Đưa thẻ lại gần đầu đọc trên thân trạm.' : step === 2 ? `Xin chào ${ME().name}! LCD đang hiển thị số dư ${vnd(ME().balance)}.` : 'Relay đóng, phiên sạc sẽ hiển thị ngay.'}</p>
  <div class="mcard" style="text-align:left;padding:4px 14px">
    <div class="step ${cls(1)}"><span class="sn">${step > 1 ? '✓' : 1}</span><div><b>Quẹt thẻ RFID</b><span>Thẻ •• ${myCard().uid.slice(-5)} · xác thực qua evcs/ST-01/req</span></div></div>
    <div class="step ${cls(2)}"><span class="sn">${step > 2 ? '✓' : 2}</span><div><b>Cắm sạc</b><span>Micro-switch phát hiện PLUG</span></div></div>
    <div class="step ${cls(3)}"><span class="sn">3</span><div><b>Phiên bắt đầu</b><span>Ngân sách: ${S.memberBudget ? vnd(S.memberBudget) : 'không giới hạn'}</span></div></div>
  </div>
  <div class="m-note" style="margin-top:14px;text-align:left">${I('mouse-pointer-click')}<span>Demo: dùng các nút bên dưới hoặc thao tác trực tiếp trên trạm ở tab <b>Trạm &amp; Guest</b>.</span></div>
  </div></div><div class="mbtn-bar" style="display:flex;gap:8px"><button class="btn btn-outline btn-lg" style="flex:1;border-radius:13px" ${step !== 1 ? 'disabled' : ''} data-a="simrf|member">${I('nfc')}Quẹt thẻ</button><button class="btn btn-primary btn-lg" style="flex:1;border-radius:13px" ${step !== 2 ? 'disabled' : ''} data-a="simplug|1">${I('plug')}Cắm sạc</button></div>`;
};

MS.active = () => {
  const s = mySession();
  if (!s) return `${mhead('Phiên sạc', false)}<div class="mbody"><div class="mpad"><div class="empty" style="padding-top:80px"><div class="ei" style="width:64px;height:64px;border-radius:18px">${I('battery')}</div><b style="color:var(--fg);font-size:16px">Bạn chưa có phiên sạc nào</b><p style="margin:6px 0 18px">Chọn một trạm đang sẵn sàng để bắt đầu.</p><button class="btn btn-primary btn-lg" style="border-radius:13px" data-a="mgo|setup|ST-01">Sạc tại SECO-01</button></div></div></div>`;
  return `${mhead('Đang sạc', false, `<span class="badge b-charging"><span class="dot"></span>Live</span>`)}<div class="mbody"><div class="mpad" data-frag="mActive"></div></div>
  <div class="mbtn-bar"><button class="btn btn-outline btn-lg w-full" style="border-radius:13px" data-a="simplug|0">${I('unplug')}Mô phỏng: rút sạc để dừng</button></div>`;
};
FR.mActive = () => {
  const s = mySession(); if (!s) return null; const u = ME(); const st = stById(s.station);
  const cap = s.budget || u.balance; const pct = clamp(s.cost / cap, 0, 1); const C = 2 * Math.PI * 100;
  return `<div class="ring-wrap"><svg viewBox="0 0 236 236"><circle cx="118" cy="118" r="100" fill="none" stroke="var(--muted-2)" stroke-width="14"/><circle cx="118" cy="118" r="100" fill="none" stroke="#437066" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C * pct} ${C}" style="transition:stroke-dasharray .5s"/></svg>
  <div class="ring-c"><span class="rl">Chi phí hiện tại</span><span class="rv">${vnd(s.cost)}</span><span class="rl">${s.budget ? `của ngân sách ${vnd(s.budget)}` : `số dư ${vnd(u.balance)}`}</span></div></div>
  <div style="text-align:center;margin-bottom:14px"><span class="badge b-outline">${I('map-pin')}${st.code} · ${s.id}</span></div>
  <div class="stat3"><div><span>Điện năng</span><b>${kwh(s.energy, 4)}</b><span>kWh</span></div><div><span>Thời gian</span><b>${durTicks(s.ticks)}</b><span>mô phỏng</span></div><div><span>Công suất</span><b>${st.p.toFixed(2)}</b><span>kW</span></div></div>
  <div class="mcard" style="margin-top:10px"><dl class="kv"><dt>Ngân sách còn lại</dt><dd class="num">${s.budget ? vnd(Math.max(0, s.budget - s.cost)) : 'Không giới hạn'}</dd><dt>Điện áp / dòng</dt><dd class="num">${st.v.toFixed(2)} V · ${st.i.toFixed(1)} A</dd><dt>Nhiệt độ trạm</dt><dd class="num" style="${st.temp > 50 ? 'color:var(--red)' : ''}">${st.temp.toFixed(1)}°C</dd><dt>Giá áp dụng</dt><dd class="num">${vnd(s.price)}/kWh</dd></dl></div>
  <div class="m-note" style="margin-top:10px">${I('info')}<span>Phiên tự dừng khi đạt ngân sách, không đủ số dư, rút sạc hoặc có sự cố an toàn.</span></div>`;
};

MS.result = () => {
  const s = S.lastResult || S.sessions.find(x => x.userId === 'U-001' && x.status === 'COMPLETED');
  const tx = S.transactions.find(t => t.sessionId === s.id);
  const ok = ['UNPLUG', 'MAX_BUDGET'].includes(s.stopReason);
  return `${mhead('Kết quả phiên', false, `<button class="back" data-a="mgo|map">${I('x')}</button>`)}<div class="mbody"><div class="mpad" style="text-align:center">
  <div style="width:72px;height:72px;border-radius:22px;margin:10px auto 14px;display:grid;place-items:center;background:${ok ? 'var(--primary-50)' : 'var(--amber-50)'};color:${ok ? 'var(--primary)' : 'var(--amber)'}">${I(ok ? 'check-circle' : 'alert-triangle').replace('class="i ', 'style="width:34px;height:34px" class="i ')}</div>
  <h3 style="margin:0;font-size:20px">Phiên sạc đã kết thúc</h3><p class="muted" style="margin:4px 0 18px;font-size:13px">Lý do: <b style="color:var(--fg)">${STOP_LABEL[s.stopReason]}</b> · <span class="mono">${s.stopReason}</span></p>
  <div class="mcard" style="text-align:left"><div class="muted" style="font-size:12px">Tổng thanh toán</div><div style="font-size:30px;font-weight:700;letter-spacing:-.02em" class="num">${vnd(s.cost)}</div><div class="sep"></div>
  <dl class="kv"><dt>Mã phiên</dt><dd class="mono">${s.id}</dd><dt>Trạm</dt><dd>${stName(s.station)}</dd><dt>Điện năng</dt><dd class="num">${kwh(s.energy)} kWh</dd><dt>Thời lượng</dt><dd>${durTicks(s.ticks)}</dd><dt>Giá</dt><dd class="num">${vnd(s.price)}/kWh</dd><dt>Ngân sách</dt><dd>${s.budget ? vnd(s.budget) : 'Không đặt'}</dd></dl>
  <div class="sep"></div><dl class="kv"><dt>Số dư trước</dt><dd class="num">${vnd(tx ? tx.before : ME().balance)}</dd><dt>Đã trừ</dt><dd class="num" style="color:var(--red)">−${vnd(s.cost)}</dd><dt>Số dư còn lại</dt><dd class="num" style="font-size:15px">${vnd(tx ? tx.after : ME().balance)}</dd></dl></div>
  </div></div><div class="mbtn-bar" style="display:flex;gap:8px"><button class="btn btn-outline btn-lg" style="flex:1;border-radius:13px" data-a="mgo|history">Lịch sử</button><button class="btn btn-primary btn-lg" style="flex:1;border-radius:13px" data-a="mgo|map">Về trang chủ</button></div>`;
};

const myTx = () => S.transactions.filter(t => t.userId === 'U-001');
const txRow = t => `<div class="list-i" style="cursor:pointer" data-a="mgo|txd|${t.id}"><span class="lic" style="background:${t.amount < 0 ? 'var(--muted)' : 'var(--primary-50)'};color:${t.amount < 0 ? 'var(--fg-2)' : 'var(--primary)'}">${I(t.type === 'CHARGE_DEDUCTION' ? 'zap' : t.type === 'TOPUP_DEMO' ? 'arrow-down-left' : 'sliders-horizontal')}</span><div class="lt"><b>${TX_LABEL[t.type]}</b><span>${fDate(t.time)}${t.sessionId ? ' · ' + stName(sessById(t.sessionId)?.station) : ''}</span></div><div class="lr" style="color:${t.amount < 0 ? 'var(--fg)' : 'var(--primary)'}">${t.amount > 0 ? '+' : ''}${vnd(t.amount)}<span>SD ${vnd(t.after)}</span></div></div>`;
MS.wallet = () => { const u = ME(); const month = myTx().filter(t => t.type === 'CHARGE_DEDUCTION').reduce((a, t) => a - t.amount, 0);
  return `${mhead('Ví của tôi', false, `<button class="back">${I('qr-code')}</button>`)}<div class="mbody"><div class="mpad">
  <div class="wallet-card"><div class="wl">Số dư khả dụng</div><div class="wv">${vnd(u.balance)}</div><div class="wr"><div>Đang giữ<b>0đ</b></div><div>Đã chi tháng này<b>${vnd(month)}</b></div><div>Thẻ<b>•• ${myCard().uid.slice(-5)}</b></div></div></div>
  <div class="qa"><button data-a="mgo|topup"><span>${I('plus')}</span>Nạp tiền</button><button data-a="mgo|txs"><span>${I('receipt')}</span>Giao dịch</button><button data-a="mgo|history"><span>${I('history')}</span>Phiên sạc</button><button data-a="mgo|profile"><span>${I('credit-card')}</span>Thẻ RFID</button></div>
  <div class="msec">Giao dịch gần đây<button data-a="mgo|txs">Xem tất cả</button></div>
  <div class="mcard" style="padding:2px 14px">${myTx().slice(0, 5).map(txRow).join('')}</div>
  <div class="m-note" style="margin-top:12px">${I('info')}<span>Tiền được trừ một lần sau khi phiên kết thúc. Phiên v1 không tạm giữ tiền trước.</span></div>
  </div></div>`; };
MS.topup = () => { const amt = MOB.topup || 20000;
  return `${mhead('Nạp tiền')}<div class="mbody"><div class="mpad">
  <div class="mcard" style="text-align:center;padding:22px 14px"><div class="muted" style="font-size:12.5px">Số tiền nạp</div><div style="font-size:34px;font-weight:700;letter-spacing:-.02em;margin:4px 0" class="num">${vnd(amt)}</div><div class="muted" style="font-size:12px">Số dư sau khi nạp: ${vnd(ME().balance + amt)}</div></div>
  <div class="presets" style="margin-top:12px">${[10000, 20000, 50000, 100000, 200000, 500000].map(v => `<button class="${amt === v ? 'on' : ''}" data-a="mtop|${v}">${vnd(v)}</button>`).join('')}</div>
  <div class="msec">Phương thức</div>
  <div class="mcard row" style="border-color:var(--primary);background:var(--primary-50)"><span class="lic" style="width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--primary)">${I('flask-conical')}</span><div style="flex:1"><b style="font-size:13.5px">Sandbox Demo</b><div class="muted" style="font-size:12px">DEMO_TOPUP_ENABLED · không trừ tiền thật</div></div>${I('check-circle')}</div>
  <div class="mcard row" style="margin-top:8px;opacity:.5"><span class="lic" style="width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--muted)">${I('landmark')}</span><div style="flex:1"><b style="font-size:13.5px">Thẻ ngân hàng</b><div class="muted" style="font-size:12px">Ngoài phạm vi dự án</div></div></div>
  </div></div><div class="mbtn-bar"><button class="btn btn-primary btn-lg w-full" style="border-radius:13px" data-a="mtopup">Nạp ${vnd(amt)}</button></div>`; };
MS.txs = () => { const f = MOB.txFilter; const list = myTx().filter(t => f === 'ALL' || (f === 'OUT' ? t.amount < 0 : t.amount > 0));
  return `${mhead('Lịch sử giao dịch')}<div class="mbody"><div class="mpad"><div class="seg" style="width:100%;margin-bottom:10px">${[['ALL', 'Tất cả'], ['OUT', 'Trừ tiền'], ['IN', 'Nạp / cộng']].map(([k, l]) => `<button style="flex:1" class="${f === k ? 'on' : ''}" data-a="mtxf|${k}">${l}</button>`).join('')}</div><div class="mcard" style="padding:2px 14px">${list.map(txRow).join('') || '<div class="empty">Không có giao dịch</div>'}</div></div></div>`; };
MS.txd = () => { const t = S.transactions.find(x => x.id === MOB.arg) || myTx()[0]; const s = t.sessionId && sessById(t.sessionId);
  return `${mhead('Chi tiết giao dịch')}<div class="mbody"><div class="mpad"><div class="mcard" style="text-align:center;padding:24px 14px"><span class="lic" style="width:52px;height:52px;border-radius:16px;display:inline-grid;place-items:center;background:var(--primary-50);color:var(--primary)">${I(t.amount < 0 ? 'zap' : 'arrow-down-left')}</span><div class="muted" style="margin-top:10px;font-size:13px">${TX_LABEL[t.type]}</div><div style="font-size:30px;font-weight:700;letter-spacing:-.02em" class="num">${t.amount > 0 ? '+' : ''}${vnd(t.amount)}</div>${badge('b-ready', t.status === 'SUCCESS' ? 'Thành công' : t.status)}</div>
  <div class="mcard" style="margin-top:10px"><dl class="kv"><dt>Mã giao dịch</dt><dd class="mono">${t.id}</dd><dt>Thời gian</dt><dd>${fDate(t.time)}</dd><dt>Số dư trước</dt><dd class="num">${vnd(t.before)}</dd><dt>Số dư sau</dt><dd class="num">${vnd(t.after)}</dd>${t.note ? `<dt>Ghi chú</dt><dd>${esc(t.note)}</dd>` : ''}</dl></div>
  ${s ? `<div class="msec">Phiên liên quan</div><div class="mcard" style="cursor:pointer" data-a="mgo|sess|${s.id}"><div class="between"><div><b>${s.id} · ${stName(s.station)}</b><div class="muted" style="font-size:12px">${kwh(s.energy, 4)} kWh · ${durTicks(s.ticks)} · ${STOP_LABEL[s.stopReason] || ''}</div></div>${I('chevron-right')}</div></div>` : ''}
  </div></div>`; };
const mySessions = () => S.sessions.filter(s => s.userId === 'U-001' && s.status !== 'ACTIVE');
MS.history = () => { const ss = mySessions(); const e = ss.reduce((a, s) => a + s.energy, 0), c = ss.reduce((a, s) => a + s.cost, 0);
  return `${mhead('Lịch sử sạc', false)}<div class="mbody"><div class="mpad">
  <div class="stat3"><div><span>Số phiên</span><b>${ss.length}</b></div><div><span>Điện năng</span><b>${kwh(e, 3)}</b><span> kWh</span></div><div><span>Tổng chi</span><b>${vnd(c)}</b></div></div>
  <div class="msec">Tháng này</div><div class="mcard" style="padding:2px 14px">${ss.map(s => `<div class="list-i" style="cursor:pointer" data-a="mgo|sess|${s.id}"><span class="lic" style="background:var(--primary-50);color:var(--primary)">${I('battery-charging')}</span><div class="lt"><b>${stName(s.station)} · ${esc(stById(s.station).name)}</b><span>${fDate(s.start)} · ${STOP_LABEL[s.stopReason]}</span></div><div class="lr">${vnd(s.cost)}<span>${kwh(s.energy, 4)} kWh</span></div></div>`).join('')}</div></div></div>`; };
MS.sess = () => { const s = sessById(MOB.arg) || mySessions()[0]; const st = stById(s.station); const tx = S.transactions.find(t => t.sessionId === s.id);
  return `${mhead('Chi tiết phiên')}<div class="mbody"><div class="mpad"><div class="hero-m"><div class="between"><b class="mono">${s.id}</b>${ssBadge(s)}</div><div style="font-size:30px;font-weight:700;letter-spacing:-.02em;margin:10px 0 0" class="num">${vnd(s.cost)}</div><div class="muted" style="font-size:12.5px">${kwh(s.energy)} kWh · ${durTicks(s.ticks)}</div></div>
  <div class="mcard" style="margin-top:10px"><dl class="kv"><dt>Trạm</dt><dd>${st.code} · ${esc(st.name)}</dd><dt>Bắt đầu</dt><dd>${fDate(s.start)}</dd><dt>Kết thúc</dt><dd>${fDate(s.end)}</dd><dt>Lý do dừng</dt><dd>${STOP_LABEL[s.stopReason]}</dd><dt>Ngân sách</dt><dd>${s.budget ? vnd(s.budget) : 'Không đặt'}</dd><dt>Giá</dt><dd>${vnd(s.price)}/kWh</dd>${tx ? `<dt>Số dư sau</dt><dd>${vnd(tx.after)}</dd>` : ''}</dl></div>
  <div class="msec">Biểu đồ điện năng</div><div class="mcard">${areaChart(Array.from({ length: 30 }, (_, i) => (i + 1) * s.energy / 30), { h: 130, fmt: x => x.toFixed(3) })}</div></div></div>`; };
MS.profile = () => { const u = ME(); const cs = S.cards.filter(c => c.userId === u.id);
  return `${mhead('Tài khoản', false)}<div class="mbody"><div class="mpad">
  <div class="row" style="gap:14px;margin-bottom:16px"><div class="avatar lg">${initials(u.name)}</div><div><b style="font-size:17px">${esc(u.name)}</b><div class="muted" style="font-size:12.5px">${u.email}</div><div class="muted" style="font-size:12.5px">${u.phone}</div></div></div>
  <div class="msec">Thẻ RFID</div>${cs.map(c => `<div style="border-radius:16px;padding:16px;color:#fff;background:linear-gradient(135deg,#2b4a43,#437066)"><div class="between">${I('nfc')}<span class="badge" style="background:rgba(255,255,255,.18);color:#fff">${c.status}</span></div><div class="mono" style="font-size:18px;letter-spacing:.12em;margin:22px 0 4px">${c.uid}</div><div style="font-size:12px;opacity:.8">${esc(u.name)} · ${c.id}</div></div>`).join('')}
  <div class="msec">Cài đặt</div><div class="mcard" style="padding:2px 14px">${[['bell', 'Thông báo phiên sạc', 'Bật'], ['languages', 'Ngôn ngữ', 'Tiếng Việt'], ['key-round', 'Đổi mật khẩu', ''], ['car', 'Xe của tôi', 'Không có ở v1'], ['circle-help', 'Trợ giúp', '']].map(r => `<div class="list-i"><span class="lic" style="background:var(--muted);color:var(--fg-2);width:34px;height:34px;border-radius:10px">${I(r[0])}</span><div class="lt"><b style="font-weight:500">${r[1]}</b></div><span class="muted" style="font-size:12.5px">${r[2]}</span>${I('chevron-right')}</div>`).join('')}</div>
  <button class="btn btn-outline btn-lg w-full" style="margin-top:14px;border-radius:13px;color:var(--red)" data-a="mlogout">${I('log-out')}Đăng xuất</button></div></div>`; };

/* ---------- Technician ---------- */

function lcdLines() {
  const st = stById('ST-01');

  if (st.status === 'CHARGING' && s) return [`${s.energy.toFixed(4)}KWH ${s.cost}D`, `${st.v.toFixed(1)}V ${st.p.toFixed(2)}KW ${Math.round(st.temp)}C`];
  if (st.lock === 'LOCKED' && SIM.payment) return SIM.payment.status === 'PENDING' ? ['CHO THANH TOAN', `QR: ${SIM.payment.amount}D`] : ['QR HET HAN', 'TAO LAI QR MOI'];

}

function fakeQR(seed, size = 25) {
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0; let r = h || 1; const rn = () => (r = (r * 1103515245 + 12345) >>> 0) / 4294967296;
  let cells = ''; const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#15211e"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#15211e"/>`;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) { const inF = (x < 8 && y < 8) || (x > size - 9 && y < 8) || (x < 8 && y > size - 9); if (!inF && rn() > .52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg class="qr" viewBox="-2 -2 ${size + 4} ${size + 4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${size + 4}" height="${size + 4}" fill="#fff"/><g fill="#15211e">${cells}</g>${finder(0, 0)}${finder(size - 7, 0)}${finder(0, size - 7)}<rect x="${size / 2 - 2.5}" y="${size / 2 - 2.5}" width="5" height="5" rx="1" fill="#437066"/></svg>`;
}

/* ---- actions ---- */
const RF = { member: 'U-001', broke: 'U-004', tech: 'U-201' };
function simRFID(kind) {
  const st = stById('ST-01');
  const uidMap = { member: '04:A3:1F:7C', broke: '5A:C9:31:0F', tech: '1C:F0:57:3B', unknown: 'FF:12:9A:00' };
  mqtt('ST-01', 'req', JSON.stringify({ action: 'rfid_verify', uid: uidMap[kind] }));
  if (kind === 'unknown') { mqtt('ST-01', 'res', '{"ok":false,"error":"CARD_NOT_FOUND"}', 'in'); return flash('THE KHONG HOP LE', 'VUI LONG THU LAI'); }
  const u = userById(RF[kind]);
  mqtt('ST-01', 'res', JSON.stringify({ ok: true, role: u.role, name: u.name, balance_vnd: u.balance }), 'in');
  if (u.role === 'TECHNICIAN') {
    if (st.status === 'ERROR' || st.status === 'MAINTENANCE') { SIM.tech = u.id; SIM.techAt = Date.now(); flash('KTV XAC THUC OK', 'GIU STOP 3 GIAY', 1600); return renderAll(); }
    return flash('KTV: TRAM ON DINH', 'KHONG CAN BAO TRI');
  }
  if (st.status === 'ERROR' || st.status === 'MAINTENANCE') return flash('TRAM TAM NGUNG', 'VUI LONG QUAY LAI');
  if (st.lock === 'LOCKED') return flash('DAU CAM DANG KHOA', 'CHO THANH TOAN');
  if (st.status === 'CHARGING') return flash('TRAM DANG SAC', 'VUI LONG DOI');
  if (u.balance < 5) return flash('SO DU KHONG DU', `SD:${u.balance}D NAP THEM`);
  if (S.sessions.some(s => s.userId === u.id && s.status === 'ACTIVE')) return flash('BAN DANG CO PHIEN', 'O TRAM KHAC');
  SIM.auth = u;
  if (SIM.plugged) memberStart(); else renderAll();
}
function memberStart() {
  const u = SIM.auth; let b = u.id === 'U-001' ? S.memberBudget : null;
  if (b && b > u.balance) b = u.balance;
  startSession('ST-01', 'MEMBER', u.id, b); S.memberBudget = null;
  if (u.id === 'U-001' && MOB.role === 'member' && ['waiting', 'setup', 'map', 'station'].includes(MOB.screen)) MOB.screen = 'active';
  renderAll();
}
function simPlug(on) {
  const st = stById('ST-01');
  if (st.lock === 'LOCKED') return flash('DAU CAM DANG KHOA', 'CHO THANH TOAN');
  SIM.plugged = !!on;
  mqtt('ST-01', 'event', JSON.stringify({ type: on ? 'PLUG' : 'UNPLUGGED' }));
  if (on && SIM.auth && st.status === 'READY') return memberStart();
  if (!on && st.status === 'CHARGING') { stopSession('ST-01', 'UNPLUG'); SIM.plugged = false; }
  renderAll();
}
function simStart() {
  const st = stById('ST-01');
  mqtt('ST-01', 'event', '{"type":"START"}');
  if (st.status !== 'READY' || st.lock === 'LOCKED') return flash('KHONG THE BAT DAU', st.lock === 'LOCKED' ? 'CHO THANH TOAN' : 'TRAM ' + st.status);
  if (SIM.auth) return flash('THANH VIEN KHONG', 'CAN NHAN START');
  if (!SIM.plugged) return flash('VUI LONG CAM SAC', 'TRUOC KHI START');
  SIM.receipt = null;
  startSession('ST-01', 'GUEST', null, SIM.guestBudget || null); renderAll();
}
function simBudget(d) { const st = stById('ST-01'); if (st.status !== 'READY' || SIM.auth) return; let i = GUEST_BUDGETS.indexOf(SIM.guestBudget) + d; SIM.guestBudget = GUEST_BUDGETS[clamp(i, 0, GUEST_BUDGETS.length - 1)]; renderAll(); }
function simStopLong() {
  mqtt('ST-01', 'event', '{"type":"STOP_HOLD_3S"}');
  if (!SIM.tech || Date.now() - SIM.techAt > 60000) return flash('CAN QUET THE KTV', 'TRUOC KHI GIU STOP');
  if (SIM.estop) return flash('NHA E-STOP TRUOC', 'ROI THU LAI');
  const r = techToggle('ST-01', SIM.tech); SIM.tech = null;
  if (r === 'READY') { SIM._tempFault = false; SIM.tempBase = Math.min(SIM.tempBase, 32); }
  renderAll();
}
function simEstop() {
  const st = stById('ST-01');
  SIM.estop = !SIM.estop;
  mqtt('ST-01', 'event', JSON.stringify({ type: SIM.estop ? 'ESTOP' : 'ESTOP_RELEASED' }));
  if (SIM.estop) {
    st.relay = false;
    if (st.status === 'CHARGING') { stopSession('ST-01', 'E_STOP'); }
    else if (st.status !== 'MAINTENANCE') raiseFault('ST-01', 'E_STOP');
    SIM.auth = null;
  }
  renderAll();
}

/* ================= App shell ================= */
const APP = { tab: 'flow' };
const TABS = [['flow', 'git-branch', 'Screen Flow'], ['admin', 'layout-dashboard', 'Web Admin'], ['mobile', 'smartphone', 'Mobile App'], ['sim', 'cpu', 'Trạm & Guest']];

function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, ic, l]) => `<button class="tab ${APP.tab === k ? 'on' : ''}" data-a="tab|${k}">${I(ic)}${l}</button>`).join('');
  const act = S.sessions.filter(s => s.status === 'ACTIVE').length, err = S.stations.filter(s => s.status === 'ERROR').length;
  $('#topstat').innerHTML = `<span class="pill-live"><span class="dot pulse"></span>${act} phiên đang sạc</span>${err ? `<span class="badge b-error"><span class="dot"></span>${err} trạm lỗi</span>` : ''}<span class="muted num" style="font-size:12px">${vnd(S.price)}/kWh</span>`;
}

function renderAll() {
  // keep scroll + focus across re-render
  const keep = {};
  ['.acontent', '#mscreen .mbody', '.mnav', '#view-sim'].forEach(sel => { const el = $(sel); if (el) keep[sel] = el.scrollTop; });
  const win = window.scrollY;
  const fe = document.activeElement; const fKey = fe && fe.dataset && fe.dataset.in; const fPos = fKey && fe.selectionStart;
  renderTabs();
  ['flow', 'admin', 'mobile', 'sim'].forEach(k => $('#view-' + k).hidden = APP.tab !== k);
  if (APP.tab === 'flow') renderFlow();
  if (APP.tab === 'admin') renderAdmin();
  if (APP.tab === 'mobile') renderMobile();
  if (APP.tab === 'sim') renderSim();
  Object.entries(keep).forEach(([sel, v]) => { const el = $(sel); if (el) el.scrollTop = v; });
  window.scrollTo(0, win);
  if (fKey) { const el = $(`[data-in="${fKey}"]`); if (el) { el.focus(); try { el.setSelectionRange(fPos, fPos); } catch (e) { } } }
  fillFrags();
}

function fillFrags() {
  $$('[data-frag]').forEach(el => {
    const f = FR[el.dataset.frag]; if (!f) return;
    let h; try { h = f(el.dataset.arg); } catch (e) { console.warn('frag', el.dataset.frag, e); return; }
    if (h == null) return;
    if (el._h !== h) { el.innerHTML = h; el._h = h; }
  });
  if (APP.tab !== 'flow') { const t = $('#topstat'); if (t && !t._busy) { const act = S.sessions.filter(s => s.status === 'ACTIVE').length; const p = t.querySelector('.pill-live'); if (p) p.lastChild.textContent = act + ' phiên đang sạc'; } }
}

function toast(title, msg = '', icon = 'zap') {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast';
  const col = icon === 'alert-triangle' ? 'var(--red)' : icon === 'wrench' ? 'var(--amber)' : 'var(--primary)';
  el.innerHTML = `<span class="ti" style="color:${col}">${I(icon)}</span><div><b>${esc(title)}</b><span>${esc(msg)}</span></div>`;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = 0; el.style.transform = 'translateY(6px)'; setTimeout(() => el.remove(), 320); }, 3400);
}
